<style>
  :root{
    --cream:#F7F1EA; --ink:#121212; --body:#5D5D5D; --muted:#6D6D6D;
    --paper:#FFFFFF; --photo-bg:#EDE5DA; --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--cream);overflow:hidden;overscroll-behavior:none}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

  .page{
    height:100vh;height:100dvh;max-width:460px;margin:0 auto;
    display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
    padding:max(18px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom));
  }
  .brand{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.03em;line-height:1}
  .brand svg{width:15px;height:15px}

  .stage{position:relative;container-type:size;min-height:0}
  .pile{
    --w:min(56cqw,74cqh,230px);
    position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:100/112;
    transform:translate(-50%,-46%);container-type:inline-size;
  }
  .polaroid{
    position:absolute;inset:0;background:var(--paper);
    padding:5.5cqw 5.5cqw 0;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(67,41,12,.10),0 14px 28px -10px rgba(67,41,12,.28);
    transition:transform .55s cubic-bezier(.3,1.25,.5,1),opacity .4s var(--ease);
    will-change:transform,opacity;
  }
  .polaroid.out{transition:transform .5s cubic-bezier(.5,0,.75,.4),opacity .45s var(--ease) .05s}
  .polaroid .ph{width:100%;aspect-ratio:1;background:var(--photo-bg);overflow:hidden}
  .polaroid img{display:block;width:100%;height:100%;object-fit:cover}
  .polaroid .cap{
    flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;
    font-size:max(8.5px,5.2cqw);line-height:1;white-space:nowrap;
  }
  .cap .d{color:var(--muted)}
  .cap .t{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;line-height:1.3;padding-bottom:.1em}

  .headline{margin:22px 0 0;display:grid;justify-items:center;text-align:center;font-weight:800;color:var(--ink);animation:rise .6s cubic-bezier(.3,1.3,.5,1) .15s both}
  .name{display:block;font-size:88px;line-height:.9;letter-spacing:-.06em;padding:0 .04em .04em}
  .rest{display:block;margin-top:8px;font-size:26px;line-height:1.1;letter-spacing:-.04em}

  .foot{display:grid;justify-items:center;gap:16px;text-align:center;animation:rise .45s var(--ease) .3s both}
  .sub{margin:0 0 10px;font-size:16px;line-height:1.35;color:var(--body)}
  .btn{
    display:flex;align-items:center;justify-content:center;height:56px;min-width:236px;padding:0 32px;border-radius:10px;
    background:var(--ink);color:#fff;text-decoration:none;font-size:17px;font-weight:600;letter-spacing:-.01em;
    transition:transform .16s var(--ease),background .16s var(--ease);touch-action:manipulation;
  }
  .btn:hover{background:#2a2a2a}
  .btn:active{transform:scale(.98);background:#000}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(18,18,18,.18)}
  .trust{margin:0;display:flex;align-items:center;gap:8px;font-size:14px;line-height:1;color:var(--muted)}
  .stars{display:flex;gap:2px}
  .stars svg{width:14px;height:14px;fill:var(--ink)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (max-height:700px){
    .headline{margin-top:14px}
    .rest{font-size:22px}
    .foot{gap:12px}
    .btn{height:52px}
  }
  @media (min-width:700px) and (min-height:760px){
    .page{max-width:560px;padding-top:28px;padding-bottom:36px}
    .brand{font-size:17px}
    .headline{margin-top:36px}
    .pile{--w:min(56cqw,74cqh,250px)}
    .rest{font-size:32px}
    .sub{font-size:18px}
  }
</style>

<body>
<main class="page">
  <div class="brand" aria-label="Sttar: Social Archive">
    <svg viewBox="0 0 36 36" aria-hidden="true"><path fill="#121212" d="M18 0s.24 6.8 2.56 11.27C23.9 7.27 27 2.45 27 2.45s-3.05 5.91-4.84 11.1c3.83 3.85 13.84 4.45 13.84 4.45s-9.88.46-13.71 4.29C18.46 26.12 18 36 18 36s-.33-6.77-2.62-11.27C12.07 28.77 9 33.54 9 33.54s3.03-5.85 4.87-11.05C9.86 18.47 0 18 0 18s9.88-.46 13.71-4.29C17.54 9.88 18 0 18 0Z"/></svg>

  <h1 class="headline"><span class="name" id="name" data-name>gabi</span><span class="rest">invited you to Sttar.</span></h1>

  <div class="stage" aria-hidden="true"><div class="pile" id="pile"></div></div>

  <div class="foot">

<script>
/* ---------- photos: add / remove files here ---------- */
const PHOTO_BASE = "https://raw.githubusercontent.com/SttarTeamManager/sttar.com-page-images/refs/heads/main/sttar.com-page-images/";
// each photo + the caption on its polaroid. add / remove lines freely.
const PHOTOS = [
  { file: "photo (1).jpg",  caption: "museum stairs" },
  { file: "photo (2).jpg",  caption: "dinner ran long" },
  { file: "photo (3).jpg",  caption: "lazy afternoon" },
  { file: "photo (4).jpg",  caption: "found a nook" },
  { file: "photo (5).jpg",  caption: "best lunch ever" },
  { file: "photo (6).jpg",  caption: "shade break" },
  { file: "photo (7).jpg",  caption: "crosswalk selfie" },
  { file: "photo (8).jpg",  caption: "golden hour" },
  { file: "photo (9).jpg",  caption: "these stairs tho" },
  { file: "photo (10).jpg", caption: "night out" },
  { file: "photo (11).jpg", caption: "fit check" },
  { file: "photo (12).jpg", caption: "swam to the arch" },
  { file: "photo (13).jpg", caption: "pool with a view" },
  { file: "photo (14).jpg", caption: "front row-ish" },
  { file: "photo (15).jpg", caption: "filming it anyway" },
  { file: "photo (16).jpg", caption: "game night" },
  { file: "photo (17).jpg", caption: "the sky did that" },
  { file: "photo (18).jpg", caption: "cliff day" },
  { file: "photo (19).jpg", caption: "paris, finally" },
  { file: "photo (20).jpg", caption: "thumbs up" },
  { file: "photo (21).jpg", caption: "the boys" },
  // photo (22) left out — greek-life banner
  { file: "photo (23).jpg", caption: "one more game" },
  { file: "photo (24).jpg", caption: "boat day" },
  { file: "photo (25).jpg", caption: "dancing till 2am" }
];
const FLIP_EVERY = 1500; // ms between swipes
const DEPTH = 3;        // cards visible in the stack

(function () {
  const { name, onelink } = window.STTAR;
  document.querySelectorAll("[data-name]").forEach(el => (el.textContent = name));
  document.getElementById("cta").href = onelink; // OneLink routes iPhone → App Store, Android → Google Play

  /* name fills the column like the sttar.com headline, capped by screen height */
  const nameEl = document.getElementById("name");
  const fitName = () => {
    const col = nameEl.parentElement.clientWidth;
    nameEl.style.fontSize = "100px";
    const w = nameEl.scrollWidth;
    nameEl.style.fontSize = Math.min(100 * col * 0.96 / w, innerHeight * 0.12, 130) + "px";
  };
  fitName(); document.fonts && document.fonts.ready.then(fitName); addEventListener("resize", fitName);

  const pile = document.getElementById("pile");
  const rand = (a, b) => a + Math.random() * (b - a);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const shots = shuffle(PHOTOS.map(p => ({ url: PHOTO_BASE + encodeURIComponent(p.file), caption: p.caption })));
  const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  let day = 0;
  const nextDate = () => { const d = new Date(Date.now() - (day++ % 90) * 864e5); return MONTHS[d.getMonth()] + " " + d.getDate(); };

  function polaroid(shot) {
    const el = document.createElement("div");
    el.className = "polaroid";
    el.innerHTML = '<div class="ph"></div><div class="cap"><span class="d"></span><span class="t"></span></div>';
    if (shot) { const img = new Image(); img.alt = ""; img.src = shot.url; el.firstChild.appendChild(img); }
    el.querySelector(".d").textContent = nextDate();
    el.querySelector(".t").textContent = shot ? shot.caption : "";
    el._r = rand(-8, 8);
    return el;
  }
  const place = (el, i) => {
    el.style.zIndex = 10 - i;
    el.style.opacity = i < DEPTH ? 1 : 0;
    el.style.transform = `translateY(${i * -4.5}%) rotate(${i === 0 ? el._r * .5 : el._r}deg) scale(${1 - i * .045})`;
  };

  /* reduced motion: static fanned stack, no swiping */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let i = 0; i < DEPTH; i++) { const el = polaroid(shots[i]); place(el, i); el.style.transition = "none"; pile.appendChild(el); }
    return;
  }

  /* preload 4 at a time; the deck only uses photos that have loaded */
  const ready = [];
  const load = s => new Promise(res => {
    const im = new Image();
    im.onload = () => Promise.race([im.decode ? im.decode().catch(() => {}) : 0, sleep(200)]).then(() => { ready.push(s); res(); });
    im.onerror = res;
    im.src = s.url;
  });
  const q = shots.slice();
  const worker = async () => { while (q.length) await load(q.shift()); };
  for (let i = 0; i < 4; i++) worker();
  let cursor = 0;
  const nextPhoto = () => { if (!ready.length) return null; if (cursor >= ready.length) cursor = 0; return ready[cursor++]; };

  const deck = [];
  const addCard = (fromBack) => {
    const el = polaroid(nextPhoto());
    if (fromBack) { place(el, DEPTH); el.style.transition = "none"; }
    pile.insertBefore(el, pile.firstChild);
    deck.push(el);
    if (fromBack) requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ""; place(el, deck.indexOf(el)); }));
    else place(el, deck.length - 1);
  };

  function flip() {
    const top = deck.shift();
    const dir = Math.random() < .5 ? -1 : 1;
    top.classList.add("out");
    top.style.zIndex = 20;
    top.style.transform = `translate(${dir * 135}%, -8%) rotate(${dir * rand(16, 24)}deg)`;
    top.style.opacity = 0;
    setTimeout(() => top.remove(), 600);
    deck.forEach(place);
    addCard(true);
  }

  (async () => {
    const t0 = performance.now();
    while (ready.length < DEPTH && performance.now() - t0 < 2000) await sleep(60); // wait for photos, max 2s
    for (let i = 0; i < DEPTH; i++) addCard(false);
    const first = deck[0];
    first.style.transition = "none";
    first.style.transform = `translateY(-14%) rotate(${first._r * 2}deg) scale(1.08)`;
    first.style.opacity = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => { first.style.transition = ""; place(first, 0); }));
    setInterval(() => { if (!document.hidden) flip(); }, FLIP_EVERY);
  })();
})();
</script>
